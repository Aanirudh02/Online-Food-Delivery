<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background-image {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .food-background {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
        }

        .signup-card {
            display: flex;
            width: 650px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            z-index: 2;
        }

        .food-image {
            width: 300px;
            height: auto;
        }

        .signup-form {
            padding: 20px;
            flex-grow: 1;
        }

        .signup-form h1 {
            margin: 0 0 20px;
            font-size: 24px;
            text-align: center;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
        }

        .signup-form input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .form-row.gap {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-row.gap input {
            width: calc(100% - 20px);
        }

        .verify-button {
            width: 60px;
            height: 30px;
            padding: 4px;
            background-color: #ff8c00;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            margin-right: -15px;
        }

        .address-input {
            width: 100%;
        }

        .signup-form button {
            width: 100%;
            padding: 10px;
            background-color: #ff8c00;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .signup-form button:hover {
            background-color: #ff6600;
        }

        .signup-form p {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background-image">
            <img src="{{ url_for('static', filename='images/fod.jpg') }}" alt="Food Background" class="food-background">
        </div>
        <div class="signup-card">
            <img src="{{ url_for('static', filename='images/naun.webp') }}" alt="Food Image" class="food-image">
            <div class="signup-form">
                <h1>Sign Up</h1>
                <form action="/signup" method="POST">
                    <div class="form-row">
                        <input type="text" name="name" placeholder="First Name" required>
                        <input type="text" name="lname" placeholder="Last Name" required>
                    </div>
                    <div class="form-row gap">
                        <input type="text" name="contact" placeholder="Phone Number" required>
                        <button type="button" class="verify-button">Verify</button>
                    </div>
                    <div class="form-row">
                        <input type="email" name="email" placeholder="Email ID" required>
                    </div>
                    <input type="password" name="password" placeholder="Password" required>
                    <input type="text" name="address" placeholder="Address" required class="address-input">
                    <button type="submit">Submit</button>
                </form>
                
                <p>Already have an account? <a href="{{url_for('login_page')}}">Login here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
