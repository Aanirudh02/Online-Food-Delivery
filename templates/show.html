<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f8f9fa;
        }
        h2 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h2>List of Restaurants</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Place</th>
            <th>District</th>
            <th>Rating</th>
            <th>Image</th>
            <th>Map</th>
        </tr>
        {% for restaurant in restaurants %}
        <tr>
            <td>{{ restaurant.name }}</td>
            <td>{{ restaurant.place }}</td>
            <td>{{ restaurant.district }}</td>
            <td>{{ restaurant.rating }}</td>
            <td>
                {% if restaurant.image_blob %}
                    <img src="data:image/jpeg;base64,{{ restaurant.image_blob }}" alt="Image of {{ restaurant.name }}" style="width: 100px; height: auto;">
                {% else %}
                    No Image
                {% endif %}
            </td>
            <td><a href="{{ restaurant.map_link }}" target="_blank">View on Google Maps</a></td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
