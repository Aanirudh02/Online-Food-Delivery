<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Form</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Hotel Information Form</h1>
    <form id="hotel-form" method="POST" action="/add_restaurant" enctype="multipart/form-data">
        <label for="name">Hotel Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="place">City:</label>
        <input type="text" id="place" name="place" required><br><br>

        <label for="district">District:</label>
        <input type="text" id="district" name="district" required><br><br>

        <button type="button" id="get-coordinates">Get Coordinates</button><br><br>

        <label for="latitude">Latitude:</label>
        <input type="text" id="latitude" name="latitude" readonly><br><br>

        <label for="longitude">Longitude:</label>
        <input type="text" id="longitude" name="longitude" readonly><br><br>

        <label for="rating">Rating:</label>
        <input type="number" id="rating" name="rating" min="1" max="5" required><br><br>

        <label for="timing">Timing:</label>
        <input type="text" id="timing" name="timing" required><br><br>

        <button type="submit">Submit</button>
    </form>

    <script>
        $(document).ready(function () {
            $('#get-coordinates').click(function () {
                const place = $('#place').val();
                const district = $('#district').val();

                $.ajax({
                    url: '/get_coordinates',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ place: place, district: district }),
                    success: function (data) {
                        $('#latitude').val(data.latitude);
                        $('#longitude').val(data.longitude);
                    },
                    error: function (xhr) {
                        alert('Could not find the location. Please check your input.');
                    }
                });
            });
        });
    </script>
</body>
</html>
