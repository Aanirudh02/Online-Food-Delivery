<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="icon" icon="x-image/icon" href="Food-Plate.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color:pink;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image: url('https://images.unsplash.com/photo-1512564186397-2b36c0b3ff64?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&q=80&w=1080');
            background-size: cover;
            background-position: center;
            font-family: 'Roboto', sans-serif;
            color: #333;
        }

        .login-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2em;
            color: #ff4b5c;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 4px;
            background-color: #ff4b5c;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .input-container {
            position: relative;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #ddd;
            transition: border-color 0.3s ease;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #ff4b5c;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #ff4b5c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 75, 92, 0.4);
        }

        button:hover {
            background-color: #ff354b;
            transform: translateY(-3px);
        }

        button:active {
            transform: translateY(1px);
        }

        @media (max-width: 450px) {
            .login-container {
                width: 90%;
                padding: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Admin Login</h1>
        <div class="input-container">
            <input type="text" id="username" placeholder="Username" required>
        </div>
        <div class="input-container">
            <input type="password" id="password" placeholder="Password" required>
        </div>
        <button onclick="login()">Login</button>
    </div>

    <script>
        function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // For demonstration, hardcoded username and password
            if (username === "admin" && password === "admin123") {
                localStorage.setItem("authenticated", "true");
                window.location.href = "{{url_for('new')}}";
            } else {
                alert("Invalid credentials!");
               
            }
        }
    </script>

</body>
</html>
