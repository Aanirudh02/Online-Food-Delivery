<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Storage</title>
    <style>
        img {
            width: 300px;  /* Set desired width */
            height: 200px; /* Set desired height */
            object-fit: cover; /* This ensures the image covers the space without distortion */
        }
        .image-container {
            margin: 10px; /* Add some space between images */
            display: inline-block; /* Allow images to be displayed in a row */
        }
    </style>
</head>
<body>
    <h1>Images from Database</h1>
    <div class="images">
        {% for image in images %}
            <div class="image-container">
                <img src="{{ url_for('image', image_id=image[0]) }}" alt="{{ image[1] }}">
                <p>{{ image[1] }}</p> <!-- Display image name -->
            </div>
        {% endfor %}
    </div>
</body>
</html>
